name: Build JARVIS Android APK

on:
  push:
    branches: [foundation, standalone-pc-android]
  pull_request:
    branches: [foundation, standalone-pc-android]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android platform
        working-directory: ui
        run: |
          flutter create --platforms=android --org=com.dancorsoodessa --project-name=jarvis_ui .
          rm -rf test
          python3 - <<'PY'
          from pathlib import Path
          p = Path('pubspec.yaml')
          text = p.read_text(encoding='utf-8')
          if 'flutter_lints:' not in text:
              text = text.replace('dev_dependencies:\n', 'dev_dependencies:\n  flutter_lints: ^6.0.0\n')
              p.write_text(text, encoding='utf-8')
          PY
          test ! -e test/widget_test.dart

      - name: Install native Android voice engine
        working-directory: ui
        run: |
          set -e
          mkdir -p android/app/src/main/kotlin/com/dancorsoodessa/jarvis_ui
          cp android_main_activity.kt android/app/src/main/kotlin/com/dancorsoodessa/jarvis_ui/MainActivity.kt
          cp -R android_tools/. android/app/src/main/kotlin/com/dancorsoodessa/jarvis_ui/
          rm -f android/app/src/main/kotlin/com/dancorsoodessa/jarvis_ui/WakeClapService.kt
          mkdir -p android/app/src/main/kotlin/com/k2fsa/sherpa/onnx
          for f in FeatureConfig.kt HomophoneReplacerConfig.kt OnlineRecognizer.kt OnlineStream.kt; do
            curl -L --fail --retry 3 "https://raw.githubusercontent.com/k2-fsa/sherpa-onnx/master/sherpa-onnx/kotlin-api/$f" -o "android/app/src/main/kotlin/com/k2fsa/sherpa/onnx/$f"
          done
          curl -L --fail --retry 3 "https://raw.githubusercontent.com/k2-fsa/sherpa-onnx/master/android/SherpaOnnxTts/app/src/main/java/com/k2fsa/sherpa/onnx/Tts.kt" -o android/app/src/main/kotlin/com/k2fsa/sherpa/onnx/Tts.kt
          mkdir -p android/app/src/main/assets
          curl -L --fail --retry 3 https://github.com/k2-fsa/sherpa-onnx/releases/download/asr-models/sherpa-onnx-streaming-zipformer-small-ru-vosk-int8-2025-08-16.tar.bz2 -o /tmp/ru-asr.tar.bz2
          tar -xjf /tmp/ru-asr.tar.bz2 -C android/app/src/main/assets
          curl -L --fail --retry 3 https://github.com/k2-fsa/sherpa-onnx/releases/download/tts-models/vits-piper-ru_RU-irina-medium.tar.bz2 -o /tmp/ru-tts.tar.bz2
          tar -xjf /tmp/ru-tts.tar.bz2 -C android/app/src/main/assets
          rm -f /tmp/ru-asr.tar.bz2 /tmp/ru-tts.tar.bz2

      - name: Configure Android permissions
        working-directory: ui
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/src/main/AndroidManifest.xml')
          text = p.read_text(encoding='utf-8')
          marker = '<manifest '
          end = text.find('>', text.find(marker))
          if end < 0:
              raise SystemExit('AndroidManifest.xml: <manifest> not found')
          head, tail = text[:end+1], text[end+1:]
          perms = []
          if 'android.permission.INTERNET' not in text: perms.append('    <uses-permission android:name="android.permission.INTERNET" />')
          if 'android.permission.RECORD_AUDIO' not in text: perms.append('    <uses-permission android:name="android.permission.RECORD_AUDIO" />')
          if 'android.permission.MODIFY_AUDIO_SETTINGS' not in text: perms.append('    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />')
          if 'android.permission.FOREGROUND_SERVICE' not in text: perms.append('    <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />')
          if 'android.permission.FOREGROUND_SERVICE_MICROPHONE' not in text: perms.append('    <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MICROPHONE" />')
          if 'android.permission.POST_NOTIFICATIONS' not in text: perms.append('    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />')
          if perms: text = head + '\n' + '\n'.join(perms) + tail
          p.write_text(text, encoding='utf-8')
          PY

      - name: Configure sherpa-onnx
        working-directory: ui
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/build.gradle')
          text = p.read_text(encoding='utf-8')
          if "com.github.k2-fsa.sherpa-onnx:sherpa-onnx:v1.13.8" not in text:
              text = text.replace('dependencies {', "dependencies {\n    implementation 'com.github.k2-fsa.sherpa-onnx:sherpa-onnx:v1.13.8'", 1)
              p.write_text(text, encoding='utf-8')
          p = Path('android/settings.gradle')
          text = p.read_text(encoding='utf-8')
          if 'jitpack.io' not in text:
              text = text.replace('repositories {', "repositories {\n        maven { url 'https://jitpack.io' }", 1)
              p.write_text(text, encoding='utf-8')
          PY

      - name: Get dependencies
        working-directory: ui
        run: flutter pub get

      - name: Analyze Dart code
        working-directory: ui
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build release APK
        working-directory: ui
        run: flutter build apk --release

      - name: Verify APK exists and hash it
        working-directory: ui
        run: |
          test -s build/app/outputs/flutter-apk/app-release.apk
          sha256sum build/app/outputs/flutter-apk/app-release.apk | tee apk.sha256
          stat -c '%n %s bytes' build/app/outputs/flutter-apk/app-release.apk

      - name: Upload JARVIS APK
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-android-apk
          path: |
            ui/build/app/outputs/flutter-apk/app-release.apk
            ui/apk.sha256
          if-no-files-found: error

