name: Build JARVIS Android APK

on:
  push:
    branches:
      - foundation
      - standalone-pc-android
      - android-final
      - android-complete-20261005
  pull_request:
    branches:
      - android-final
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project
        working-directory: ui
        run: |
          flutter create --platforms=android --org=com.dancorsoodessa --project-name=jarvis_ui .
          rm -rf test

      - name: Configure Android permissions
        working-directory: ui
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/src/main/AndroidManifest.xml")
          lines = p.read_text(encoding="utf-8").splitlines()
          if not any("android.permission.INTERNET" in line for line in lines):
              for i, line in enumerate(lines):
                  if line.lstrip().startswith("<manifest "):
                      lines[i + 1:i + 1] = [
                          '    <uses-permission android:name="android.permission.INTERNET" />',
                          '    <uses-permission android:name="android.permission.RECORD_AUDIO" />',
                          '    <queries>',
                          '        <intent>',
                          '            <action android:name="android.speech.RecognitionService" />',
                          '        </intent>',
                          '    </queries>',
                      ]
                      break
          p.write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY

      - name: Get dependencies
        working-directory: ui
        run: flutter pub get

      - name: Analyze Dart
        working-directory: ui
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build release APK
        working-directory: ui
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-android-apk
          path: ui/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
