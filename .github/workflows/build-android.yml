name: Build JARVIS Android APK

on:
  push:
    branches: ["**"]
    paths:
      - "ui/**"
      - ".github/workflows/build-android.yml"
  pull_request:
    branches: [foundation, standalone-pc-android, android-complete-20261005]
    paths:
      - "ui/**"
      - ".github/workflows/build-android.yml"
  workflow_dispatch:

concurrency:
  group: jarvis-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Analyze and test before build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android project
        working-directory: ui
        run: |
          set -e
          flutter create --platforms=android --org=com.dancorsoodessa --project-name=jarvis_ui .
          rm -f test/widget_test.dart
      - name: Get dependencies
        working-directory: ui
        run: flutter pub get
      - name: Verify analyzed source revision
        working-directory: ui
        run: |
          set -e
          echo "CHECKED_OUT_COMMIT=$(git -C .. rev-parse HEAD)"
          sha256sum lib/jarvis_reactor.dart lib/main.dart
          grep -nE 'withOpacity|withValues' lib/jarvis_reactor.dart || true
      - name: Analyze Dart (strict)
        working-directory: ui
        run: flutter analyze --no-pub
      - name: Run Flutter tests
        working-directory: ui
        run: flutter test

  build-android:
    name: Build release APK (only after validation)
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Preserve native Android integration
        working-directory: ui
        run: |
          set -e
          mkdir -p "$RUNNER_TEMP/jarvis-native"
          cp android/app/src/main/kotlin/com/dancorsoodessa/jarvis_ui/MainActivity.kt "$RUNNER_TEMP/jarvis-native/MainActivity.kt"
          cp android/app/src/main/kotlin/com/dancorsoodessa/jarvis_ui/JarvisTimerReceiver.kt "$RUNNER_TEMP/jarvis-native/JarvisTimerReceiver.kt"
          cp android/app/src/main/res/drawable-nodpi/jarvis_reactor_logo.png "$RUNNER_TEMP/jarvis-native/jarvis_reactor_logo.png"
      - name: Generate Android project
        working-directory: ui
        run: |
          set -e
          flutter create --platforms=android --org=com.dancorsoodessa --project-name=jarvis_ui .
          rm -f test/widget_test.dart
      - name: Restore native Android tools and channels
        working-directory: ui
        shell: bash
        run: |
          set -euo pipefail
          KOTLIN=android/app/src/main/kotlin/com/dancorsoodessa/jarvis_ui
          mkdir -p "$KOTLIN"
          cp "$RUNNER_TEMP/jarvis-native/MainActivity.kt" "$KOTLIN/MainActivity.kt"
          cp "$RUNNER_TEMP/jarvis-native/JarvisTimerReceiver.kt" "$KOTLIN/JarvisTimerReceiver.kt"
          mkdir -p android/app/src/main/res/drawable-nodpi
          cp "$RUNNER_TEMP/jarvis-native/jarvis_reactor_logo.png" android/app/src/main/res/drawable-nodpi/jarvis_reactor_logo.png
          cp android_tool_router.kt "$KOTLIN/AndroidToolRouter.kt"
          cp android_tools/TradingTools.kt "$KOTLIN/TradingTools.kt"
          cp android_tools/StockAnalysisTools.kt "$KOTLIN/StockAnalysisTools.kt"
          for dir in database files internet other selfimprovement; do
            find "android_tools/$dir" -type f -name '*.kt' -exec cp {} "$KOTLIN/" \;
          done
      - name: Configure Android permissions
        working-directory: ui
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/src/main/AndroidManifest.xml")
          text = p.read_text(encoding="utf-8")
          permissions = [
              '    <uses-permission android:name="android.permission.INTERNET" />',
              '    <uses-permission android:name="android.permission.RECORD_AUDIO" />',
              '    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />',
          ]
          for permission in permissions:
              if permission not in text:
                  text = text.replace("<application", permission + "\n    <application", 1)
          if "android.speech.RecognitionService" not in text:
              text = text.replace("<application", '    <queries>\n        <intent>\n            <action android:name="android.speech.RecognitionService" />\n        </intent>\n    </queries>\n    <application', 1)
          receiver = '        <receiver android:name=".JarvisTimerReceiver" android:exported="false" />'
          if "JarvisTimerReceiver" not in text:
              text = text.replace("        <meta-data android:name=\"flutterEmbedding\"", receiver + "\n        <meta-data android:name=\"flutterEmbedding\"", 1)
          if 'android:icon="@drawable/jarvis_reactor_logo"' not in text:
              text = text.replace("<application", '<application android:icon="@drawable/jarvis_reactor_logo" android:roundIcon="@drawable/jarvis_reactor_logo"', 1)
          p.write_text(text, encoding="utf-8")
          PY
      - name: Get dependencies
        working-directory: ui
        run: flutter pub get
      - name: Build release APK
        working-directory: ui
        run: flutter build apk --release
      - name: Verify APK
        working-directory: ui
        run: |
          set -e
          APK=build/app/outputs/flutter-apk/app-release.apk
          test -s "$APK"
          file "$APK"
          sha256sum "$APK"
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-android-apk
          path: ui/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
