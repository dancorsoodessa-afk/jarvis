name: Build JARVIS Android APK

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [foundation, standalone-pc-android]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android platform
        working-directory: ui
        run: |
          set -e
          flutter create --platforms=android --org=com.dancorsoodessa --project-name=jarvis_ui .
          rm -rf test
          mkdir -p android/app/libs
          curl -L --fail --retry 3 https://github.com/k2-fsa/sherpa-onnx/releases/download/v1.13.8/sherpa-onnx-1.13.8.aar -o android/app/libs/sherpa-onnx-1.13.8.aar
          echo "633c24321e06b1fe79feafa03ea16cbc0f8a286641e2da3559bac91bdb13bd96  android/app/libs/sherpa-onnx-1.13.8.aar" | sha256sum -c -
          python3 - <<'PY'
          from pathlib import Path
          p = Path('pubspec.yaml')
          text = p.read_text(encoding='utf-8')
          if 'flutter_lints:' not in text:
              text = text.replace('dev_dependencies:\n', 'dev_dependencies:\n  flutter_lints: ^6.0.0\n')
              p.write_text(text, encoding='utf-8')
          PY
          test ! -e test/widget_test.dart

      - name: Install native Android voice engine
        working-directory: ui
        run: |
          set -e
          root=android/app/src/main/kotlin/com/dancorsoodessa/jarvis_ui
          mkdir -p "$root"
          cp android_main_activity.kt "$root/MainActivity.kt"
          cp android_tools/AndroidToolRouter.kt "$root/AndroidToolRouter.kt"
          mkdir -p "$root/database" "$root/files" "$root/internet" "$root/other" "$root/selfimprovement"
          cp android_tools/database/DatabaseTools.kt "$root/database/DatabaseTools.kt"
          cp android_tools/files/FileTools.kt "$root/files/FileTools.kt"
          cp android_tools/internet/InternetTools.kt "$root/internet/InternetTools.kt"
          cp android_tools/other/OtherTools.kt "$root/other/OtherTools.kt"
          cp android_tools/selfimprovement/SelfImprovementEngine.kt "$root/selfimprovement/SelfImprovementEngine.kt"
          mkdir -p android/app/src/main/assets
          curl -L --fail --retry 3 https://github.com/k2-fsa/sherpa-onnx/releases/download/asr-models/sherpa-onnx-streaming-zipformer-small-ru-vosk-int8-2025-08-16.tar.bz2 -o /tmp/ru-asr.tar.bz2
          tar -xjf /tmp/ru-asr.tar.bz2 -C android/app/src/main/assets
          curl -L --fail --retry 3 https://github.com/k2-fsa/sherpa-onnx/releases/download/tts-models/vits-piper-ru_RU-irina-medium.tar.bz2 -o /tmp/ru-tts.tar.bz2
          tar -xjf /tmp/ru-tts.tar.bz2 -C android/app/src/main/assets
          rm -f /tmp/ru-asr.tar.bz2 /tmp/ru-tts.tar.bz2

      - name: Configure Android permissions and sherpa-onnx
        working-directory: ui
        run: |
          set -e
          python3 - <<'PY'
          from pathlib import Path

          p = Path('android/app/src/main/AndroidManifest.xml')
          text = p.read_text(encoding='utf-8')
          end = text.find('>', text.find('<manifest '))
          if end < 0:
              raise SystemExit('AndroidManifest.xml: <manifest> not found')
          head, tail = text[:end+1], text[end+1:]
          perms = [
              'android.permission.INTERNET',
              'android.permission.RECORD_AUDIO',
              'android.permission.MODIFY_AUDIO_SETTINGS',
              'android.permission.FOREGROUND_SERVICE',
              'android.permission.FOREGROUND_SERVICE_MICROPHONE',
              'android.permission.POST_NOTIFICATIONS',
          ]
          for name in perms:
              line = f'    <uses-permission android:name="{name}" />'
              if name not in text:
                  text = head + '\n' + line + tail
                  end = text.find('>', text.find('<manifest '))
                  head, tail = text[:end+1], text[end+1:]
          p.write_text(text, encoding='utf-8')

          p = Path('android/settings.gradle.kts')
          text = p.read_text(encoding='utf-8')
          # Sherpa is bundled as a verified local AAR, so no JitPack repository is needed.
          text = text.replace('    repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)\\n', '')
          text = text.replace('        maven { url = uri("https://jitpack.io") }\\n', '')
          p.write_text(text, encoding='utf-8')

          p = Path('android/app/build.gradle.kts')
          text = p.read_text(encoding='utf-8')
          dep = 'implementation(files("libs/sherpa-onnx-1.13.8.aar"))'
          if dep not in text:
              if 'dependencies {' not in text:
                  raise SystemExit('app/build.gradle.kts: dependencies block not found')
              text = text.replace('dependencies {', 'dependencies {\n    ' + dep, 1)
          p.write_text(text, encoding='utf-8')
          PY
          grep -n "sherpa-onnx\|jitpack" android/app/build.gradle.kts android/settings.gradle.kts

      - name: Get dependencies
        working-directory: ui
        run: flutter pub get

      - name: Analyze Dart code
        working-directory: ui
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build release APK
        working-directory: ui
        run: flutter build apk --release

      - name: Verify APK exists and hash it
        working-directory: ui
        run: |
          set -e
          test -s build/app/outputs/flutter-apk/app-release.apk
          sha256sum build/app/outputs/flutter-apk/app-release.apk | tee apk.sha256
          stat -c '%n %s bytes' build/app/outputs/flutter-apk/app-release.apk

      - name: Upload JARVIS APK
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-android-apk
          path: |
            ui/build/app/outputs/flutter-apk/app-release.apk
            ui/apk.sha256
          if-no-files-found: error

