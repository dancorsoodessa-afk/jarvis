name: Build JARVIS для Windows

on:
  workflow_dispatch:
  push:
    branches: [foundation]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    steps:
      - name: Получить исходники
        uses: actions/checkout@v6

      - name: Установить Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Собрать и проверить Windows-пакет
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File scripts\build_exe.ps1

      - name: Загрузить готовый Windows-пакет
        uses: actions/upload-artifact@v7
        with:
          name: JARVIS-Windows-x64
          path: release/JARVIS.exe
          if-no-files-found: error
# Release build trigger: foundation

      - name: Опубликовать прямой EXE-релиз
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "windows-${{ github.run_number }}"
          gh release create $tag release/JARVIS.exe --title "JARVIS Windows ${{ github.run_number }}" --notes "Финальная Windows x64 сборка JARVIS. Прямой исполняемый файл без ZIP." --latest
