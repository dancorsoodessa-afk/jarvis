name: Build jarvis.exe

on:
  push:
    branches: [foundation]
  pull_request:
    branches: [foundation]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install project and release dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[all]"
          python -m pip install --upgrade pyinstaller pytest
      - name: Run tests
        run: pytest tests/ -q

      - name: Build exe
        run: pyinstaller jarvis.spec --clean --noconfirm

      - name: Upload jarvis.exe
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-windows-x64
          path: dist/jarvis.exe
