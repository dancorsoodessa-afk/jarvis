name: Build Windows JARVIS EXE

on:
  push:
    branches: [foundation]
    paths:
      - 'agent/**'
      - 'docs/**'
      - 'ui/**'
      - 'tests/**'
      - 'scripts/build_exe.ps1'
      - 'jarvis_desktop.py'
      - 'jarvis_desktop.spec'
      - 'pyproject.toml'
      - 'poetry.lock'
      - '.github/workflows/build-windows-exe.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: jarvis-windows-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile Python modules
        shell: pwsh
        run: |
          python -m compileall -q agent jarvis_desktop.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run tests and build packaged executable
        shell: pwsh
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts\build_exe.ps1
          if ($LASTEXITCODE -ne 0) { throw "Build script failed with exit code $LASTEXITCODE" }
          if (!(Test-Path 'release/JARVIS.exe')) { throw 'release/JARVIS.exe was not created' }
          if ((Get-Item 'release/JARVIS.exe').Length -lt 1MB) { throw 'JARVIS.exe is unexpectedly small' }
      - name: Upload executable artifact
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-Windows-x64
          path: release/JARVIS.exe
          if-no-files-found: error
          retention-days: 14
      - name: Publish versioned release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: windows-${{ github.run_number }}
          name: JARVIS Windows Build ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          fail_on_unmatched_files: true
          files: release/JARVIS.exe
