name: Build JARVIS Android APK

on:
  push:
    branches: [foundation, standalone-pc-android]
  pull_request:
    branches: [foundation, standalone-pc-android]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android platform
        working-directory: ui
        run: |
          flutter create --platforms=android --org=com.dancorsoodessa --project-name=jarvis_ui .
          rm -rf test
          python3 - <<'PY'
          from pathlib import Path
          p = Path('pubspec.yaml')
          text = p.read_text(encoding='utf-8')
          if 'flutter_lints:' not in text:
              text = text.replace('dev_dependencies:\n', 'dev_dependencies:\n  flutter_lints: ^6.0.0\n')
              p.write_text(text, encoding='utf-8')
          PY
          test ! -e test/widget_test.dart

      - name: Install native Android agent layer
        working-directory: ui
        run: |
          mkdir -p android/app/src/main/kotlin/com/dancorsoodessa/jarvis_ui
          cp android_main_activity.kt android/app/src/main/kotlin/com/dancorsoodessa/jarvis_ui/MainActivity.kt
          cp -R android_tools/. android/app/src/main/kotlin/com/dancorsoodessa/jarvis_ui/

      - name: Configure Android permissions
        working-directory: ui
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/src/main/AndroidManifest.xml')
          text = p.read_text(encoding='utf-8')
          marker = '<manifest '
          end = text.find('>', text.find(marker))
          if end < 0:
              raise SystemExit('AndroidManifest.xml: <manifest> not found')
          head, tail = text[:end+1], text[end+1:]
          perms = []
          if 'android.permission.INTERNET' not in text: perms.append('    <uses-permission android:name="android.permission.INTERNET" />')
          if 'android.permission.RECORD_AUDIO' not in text: perms.append('    <uses-permission android:name="android.permission.RECORD_AUDIO" />')
          if perms: text = head + '\n' + '\n'.join(perms) + tail
          p.write_text(text, encoding='utf-8')
          PY

      - name: Get dependencies
        working-directory: ui
        run: flutter pub get

      - name: Analyze Dart code
        working-directory: ui
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build release APK
        working-directory: ui
        run: flutter build apk --release

      - name: Verify APK exists and hash it
        working-directory: ui
        run: |
          test -s build/app/outputs/flutter-apk/app-release.apk
          sha256sum build/app/outputs/flutter-apk/app-release.apk | tee apk.sha256
          stat -c '%n %s bytes' build/app/outputs/flutter-apk/app-release.apk

      - name: Upload JARVIS APK
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-android-apk
          path: |
            ui/build/app/outputs/flutter-apk/app-release.apk
            ui/apk.sha256
          if-no-files-found: error

  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build and test Windows package
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File scripts\build_exe.ps1

      - name: Verify Windows package
        shell: pwsh
        run: |
          if (-not (Test-Path "JARVIS-Windows-x64.zip")) { throw "JARVIS-Windows-x64.zip not found" }
          Get-Item "JARVIS-Windows-x64.zip" | Format-List Name,Length,FullName

      - name: Upload JARVIS Windows x64
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-Windows-x64
          path: JARVIS-Windows-x64.zip
          if-no-files-found: error
