name: Build JARVIS Android APK

concurrency:
  group: jarvis-android-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - android-final
      - fix/android-live-core-tools-20261027
      - fix/android-voice-folders-audit-20261027
      - fix/android-mic-compact-chat-20261028
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project
        working-directory: ui
        run: flutter create --platforms=android --org=com.dancorsoodessa --project-name=jarvis_ui .

      - name: Set Android compile SDK for current plugins
        working-directory: ui
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          candidates = [
              Path("android/app/build.gradle.kts"),
              Path("android/app/build.gradle"),
          ]
          changed = False
          for path in candidates:
              if not path.exists():
                  continue
              source = path.read_text(encoding="utf-8")
              updated = source
              updated = re.sub(r'compileSdk\s*=\s*flutter\.compileSdkVersion', 'compileSdk = 36', updated)
              updated = re.sub(r'compileSdkVersion\s+flutter\.compileSdkVersion', 'compileSdkVersion 36', updated)
              updated = re.sub(r'compileSdk\s+flutter\.compileSdkVersion', 'compileSdk 36', updated)
              if updated != source:
                  path.write_text(updated, encoding="utf-8")
                  changed = True
          if not changed:
              raise SystemExit("Could not set Android compileSdk to 36 in generated Gradle file")
          PY

      - name: Remove generated sample test
        working-directory: ui
        run: rm -f test/widget_test.dart

      - name: Configure required Android permissions
        working-directory: ui
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          text = manifest.read_text(encoding="utf-8")
          additions = []
          if "android.permission.INTERNET" not in text:
              additions.append('    <uses-permission android:name="android.permission.INTERNET" />')
          if "android.permission.RECORD_AUDIO" not in text:
              additions.append('    <uses-permission android:name="android.permission.RECORD_AUDIO" />')
          if "android.permission.MODIFY_AUDIO_SETTINGS" not in text:
              additions.append('    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />')
          if additions:
              lines = text.splitlines()
              for index, line in enumerate(lines):
                  if line.lstrip().startswith("<manifest "):
                      lines[index + 1:index + 1] = additions
                      break
              else:
                  raise SystemExit("AndroidManifest.xml has no <manifest> root element")
              text = "\n".join(lines) + "\n"

          intents = []
          if "android.speech.RecognitionService" not in text:
              intents.append(
                  '        <intent>\n'
                  '            <action android:name="android.speech.RecognitionService" />\n'
                  '        </intent>\n'
              )
          if "android.intent.category.LAUNCHER" not in text:
              intents.append(
                  '        <intent>\n'
                  '            <action android:name="android.intent.action.MAIN" />\n'
                  '            <category android:name="android.intent.category.LAUNCHER" />\n'
                  '        </intent>\n'
              )
          if intents:
              query_content = "".join(intents)
              if "</queries>" in text:
                  text = text.replace("</queries>", query_content + "    </queries>", 1)
              else:
                  queries = '    <queries>\n' + query_content + '    </queries>\n'
                  if "<application" not in text:
                      raise SystemExit("AndroidManifest.xml has no <application> element")
                  text = text.replace("    <application", queries + "    <application", 1)

          manifest.write_text(text, encoding="utf-8")
          PY

      - name: Configure JARVIS launcher icon
        working-directory: ui
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p android/app/src/main/res/drawable android/app/src/main/res/mipmap-anydpi-v26
          cp crypto/ic_jarvis_foreground.xml android/app/src/main/res/drawable/ic_jarvis_foreground.xml
          cp crypto/ic_jarvis_adaptive.xml android/app/src/main/res/mipmap-anydpi-v26/ic_jarvis.xml
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text(encoding="utf-8")
          import re
          s, count = re.subn(r'android:icon="[^"]+"', 'android:icon="@mipmap/ic_jarvis"', s, count=1)
          if count == 0:
              s, count = re.subn(r'<application\b', '<application android:icon="@mipmap/ic_jarvis"', s, count=1)
          if count == 0:
              raise SystemExit("Could not configure Android application icon")
          s = re.sub(r'android:label="[^"]+"', 'android:label="JARVIS"', s, count=1)
          p.write_text(s, encoding="utf-8")
          PY

      - name: Configure native Android device tools
        working-directory: ui
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p android/app/src/main/kotlin/com/dancorsoodessa/jarvis_ui
          cat > android/app/src/main/kotlin/com/dancorsoodessa/jarvis_ui/MainActivity.kt <<'KOTLIN'
          package com.dancorsoodessa.jarvis_ui

          import android.app.ActivityManager
          import android.content.ContentValues
          import android.content.Context
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.graphics.Bitmap
          import android.net.Uri
          import android.media.AudioManager
          import android.os.Build
          import android.os.Environment
          import android.os.Handler
          import android.os.Looper
          import android.view.PixelCopy
          import android.provider.MediaStore
          import android.os.Process
          import io.flutter.embedding.android.FlutterActivity
          import io.flutter.embedding.engine.FlutterEngine
          import io.flutter.plugin.common.MethodChannel

          class MainActivity : FlutterActivity() {
              override fun configureFlutterEngine(flutterEngine: FlutterEngine) {
                  super.configureFlutterEngine(flutterEngine)
                  MethodChannel(flutterEngine.dartExecutor.binaryMessenger, "com.dancorsoodessa.jarvis/device")
                      .setMethodCallHandler { call, result ->
                          when (call.method) {
                              "systemInfo" -> {
                                  val manager = getSystemService(Context.ACTIVITY_SERVICE) as ActivityManager
                                  val memory = ActivityManager.MemoryInfo()
                                  manager.getMemoryInfo(memory)
                                  result.success(mapOf(
                                      "androidVersion" to Build.VERSION.RELEASE,
                                      "sdkInt" to Build.VERSION.SDK_INT,
                                      "processId" to Process.myPid(),
                                      "availableMemoryBytes" to memory.availMem,
                                      "totalMemoryBytes" to memory.totalMem,
                                      "lowMemory" to memory.lowMemory,
                                      "appMaxHeapBytes" to Runtime.getRuntime().maxMemory()
                                  ))
                              }
                              "listLaunchableApps" -> {
                                  val intent = Intent(Intent.ACTION_MAIN, null).addCategory(Intent.CATEGORY_LAUNCHER)
                                  val apps = packageManager.queryIntentActivities(intent, PackageManager.MATCH_DEFAULT_ONLY)
                                      .mapNotNull { item ->
                                          val activity = item.activityInfo ?: return@mapNotNull null
                                          mapOf("label" to item.loadLabel(packageManager).toString(), "packageName" to activity.packageName)
                                      }
                                      .distinctBy { it["packageName"] }
                                      .sortedBy { it["label"]?.lowercase() ?: "" }
                                  result.success(apps)
                              }
                              "launchApp" -> {
                                  val packageName = call.argument<String>("packageName")
                                  if (packageName.isNullOrBlank()) {
                                      result.error("INVALID_PACKAGE", "Не указан пакет приложения", null)
                                  } else {
                                      val launch = packageManager.getLaunchIntentForPackage(packageName)
                                      if (launch == null) result.error("NOT_LAUNCHABLE", "Приложение нельзя запустить: $packageName", null)
                                      else {
                                          launch.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                                          startActivity(launch)
                                          result.success(true)
                                      }
                                  }
                              }
                              "openAppSettings" -> {
                                  try {
                                      val uri = Uri.fromParts("package", packageName, null)
                                      val intent = Intent(android.provider.Settings.ACTION_APPLICATION_DETAILS_SETTINGS, uri)
                                      intent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                                      startActivity(intent)
                                      result.success(true)
                                  } catch (error: Exception) {
                                      result.error("APP_SETTINGS_FAILED", error.message, null)
                                  }
                              }
                              "openUrl" -> {
                                  val rawUrl = call.argument<String>("url")
                                  val uri = try { rawUrl?.let { Uri.parse(it) } } catch (_: Exception) { null }
                                  if (uri == null || uri.host.isNullOrBlank() || (uri.scheme != "https" && uri.scheme != "http")) {
                                      result.error("INVALID_URL", "Нужен корректный HTTP/HTTPS URL", null)
                                  } else {
                                      try {
                                          startActivity(Intent(Intent.ACTION_VIEW, uri))
                                          result.success(true)
                                      } catch (error: Exception) {
                                          result.error("OPEN_URL_FAILED", error.message, null)
                                      }
                                  }
                              }
                              "captureScreenshot" -> {
                                  if (Build.VERSION.SDK_INT < Build.VERSION_CODES.O) {
                                      result.error("SCREENSHOT_UNSUPPORTED", "Снимок экрана требует Android 8 или новее", null)
                                  } else {
                                      val view = window.decorView
                                      val bitmap = Bitmap.createBitmap(view.width.coerceAtLeast(1), view.height.coerceAtLeast(1), Bitmap.Config.ARGB_8888)
                                      PixelCopy.request(window, bitmap, { copyResult ->
                                          if (copyResult != PixelCopy.SUCCESS) {
                                              bitmap.recycle()
                                              result.error("SCREENSHOT_FAILED", "PixelCopy завершился с кодом $copyResult", null)
                                          } else {
                                              try {
                                                  val values = ContentValues().apply {
                                                      put(MediaStore.Images.Media.DISPLAY_NAME, "JARVIS_${System.currentTimeMillis()}.png")
                                                      put(MediaStore.Images.Media.MIME_TYPE, "image/png")
                                                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                                                          put(MediaStore.Images.Media.RELATIVE_PATH, Environment.DIRECTORY_PICTURES + "/JARVIS")
                                                      }
                                                  }
                                                  val imageUri = contentResolver.insert(MediaStore.Images.Media.EXTERNAL_CONTENT_URI, values)
                                                  if (imageUri == null) {
                                                      result.error("SCREENSHOT_SAVE_FAILED", "Не удалось создать запись изображения", null)
                                                  } else {
                                                      val output = contentResolver.openOutputStream(imageUri)
                                                      if (output == null) result.error("SCREENSHOT_SAVE_FAILED", "Не удалось открыть файл изображения", null)
                                                      else {
                                                          output.use { bitmap.compress(Bitmap.CompressFormat.PNG, 100, it) }
                                                          result.success(imageUri.toString())
                                                      }
                                                  }
                                              } catch (error: Exception) {
                                                  result.error("SCREENSHOT_SAVE_FAILED", error.message, null)
                                              } finally {
                                                  bitmap.recycle()
                                              }
                                          }
                                      }, Handler(Looper.getMainLooper()))
                                  }
                              }
                              "getVolume" -> {
                                  val audio = getSystemService(Context.AUDIO_SERVICE) as AudioManager
                                  val max = audio.getStreamMaxVolume(AudioManager.STREAM_MUSIC)
                                  val current = audio.getStreamVolume(AudioManager.STREAM_MUSIC)
                                  result.success(mapOf("current" to current, "max" to max, "percent" to if (max == 0) 0 else current * 100 / max))
                              }
                              "setVolume" -> {
                                  val percent = call.argument<Int>("percent")
                                  if (percent == null || percent !in 0..100) {
                                      result.error("INVALID_VOLUME", "Громкость должна быть от 0 до 100", null)
                                  } else {
                                      val audio = getSystemService(Context.AUDIO_SERVICE) as AudioManager
                                      val max = audio.getStreamMaxVolume(AudioManager.STREAM_MUSIC)
                                      audio.setStreamVolume(AudioManager.STREAM_MUSIC, (max * percent / 100.0).toInt(), 0)
                                      result.success(true)
                                  }
                              }
                              else -> result.notImplemented()
                          }
                      }
              }
          }
          KOTLIN

      - name: Get dependencies
        working-directory: ui
        run: flutter pub get

      - name: Analyze Dart
        working-directory: ui
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Run unit tests
        working-directory: ui
        run: flutter test

      - name: Build release APK
        working-directory: ui
        run: flutter build apk --release

      - name: Verify APK integrity, alignment, signature and permissions
        shell: bash
        run: |
          set -euo pipefail
          APK="ui/build/app/outputs/flutter-apk/app-release.apk"
          test -s "$APK"
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n1)"
          test -x "$BUILD_TOOLS/zipalign"
          test -x "$BUILD_TOOLS/apksigner"
          test -x "$BUILD_TOOLS/aapt"
          "$BUILD_TOOLS/zipalign" -c -v 4 "$APK"
          "$BUILD_TOOLS/apksigner" verify --verbose "$APK"
          "$BUILD_TOOLS/aapt" dump permissions "$APK" | tee /tmp/jarvis-permissions.txt
          grep -q 'android.permission.INTERNET' /tmp/jarvis-permissions.txt
          grep -q 'android.permission.RECORD_AUDIO' /tmp/jarvis-permissions.txt
          sha256sum "$APK" | tee ui/build/app/outputs/flutter-apk/SHA256SUMS.txt

      - name: Upload verified APK
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-android-apk
          path: |
            ui/build/app/outputs/flutter-apk/app-release.apk
            ui/build/app/outputs/flutter-apk/SHA256SUMS.txt
          if-no-files-found: error
