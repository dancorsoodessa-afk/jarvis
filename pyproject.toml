[tool.poetry]
name = "jarvis-agent"
version = "0.1.0"
description = "Personal AI agent / desktop assistant for Windows x64 (cloud-first, local llama.cpp + Vulkan opt-in)"
authors = ["Jarvis Developer"]
license = "MIT"
readme = "README.md"
packages = [{ include = "agent" }]

[tool.poetry.dependencies]
python = ">=3.10,<3.15"
# Screenshot support on all platforms
Pillow = { version = ">=10.0", optional = true }
# Volume control on Windows (COM Audio API)
pycaw = { version = ">=20240210", optional = true, markers = "sys_platform == 'win32'" }
# Desktop microphone recording and speech recognition
sounddevice = { version = ">=0.5.0", optional = true }
SpeechRecognition = { version = ">=3.10.0", optional = true }
# Windows Credential Manager for the cloud API key
keyring = { version = ">=25.0", optional = true }

[tool.poetry.extras]
screenshot = ["Pillow"]
windows-audio = ["pycaw"]
voice = ["sounddevice", "SpeechRecognition"]
secure-settings = ["keyring"]
all = ["Pillow", "pycaw", "sounddevice", "SpeechRecognition", "keyring"]

[tool.poetry.scripts]
jarvis = "agent.__main__:main"

[tool.poetry.group.dev.dependencies]
pytest = ">=8.0"

[build-system]
requires = ["poetry-core>=1.9"]
build-backend = "poetry.core.masonry.api"
