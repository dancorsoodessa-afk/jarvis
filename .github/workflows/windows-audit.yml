name: Windows audit and release build

on:
  pull_request:
    branches: [foundation]
  push:
    branches: [foundation, "fix/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Run tests and build Windows EXE
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts\build_exe.ps1
      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-Windows-x64
          path: release/JARVIS.exe
          if-no-files-found: error
          retention-days: 7
