name: Build JARVIS Android APK

on:
  push:
    branches: ["**"]
    paths:
      - "ui/**"
      - ".github/workflows/build-android.yml"
  pull_request:
    branches: [foundation, standalone-pc-android, android-complete-20261005]
    paths:
      - "ui/**"
      - ".github/workflows/build-android.yml"
  workflow_dispatch:

concurrency:
  group: jarvis-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Analyze and test before build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android project
        working-directory: ui
        run: |
          set -e
          flutter create --platforms=android --org=com.dancorsoodessa --project-name=jarvis_ui .
          rm -f test/widget_test.dart
      - name: Get dependencies
        working-directory: ui
        run: flutter pub get
      - name: Verify analyzed source revision
        working-directory: ui
        run: |
          set -e
          echo "CHECKED_OUT_COMMIT=$(git -C .. rev-parse HEAD)"
          sha256sum lib/jarvis_reactor.dart lib/main.dart
          grep -nE 'withOpacity|withValues' lib/jarvis_reactor.dart || true
      - name: Analyze Dart (strict)
        working-directory: ui
        run: flutter analyze --no-pub
      - name: Run Flutter tests
        working-directory: ui
        run: flutter test

  build-android:
    name: Build release APK (only after validation)
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Preserve native Android integration
        working-directory: ui
        run: |
          set -e
          mkdir -p "$RUNNER_TEMP/jarvis-native"
          cp android/app/src/main/kotlin/com/dancorsoodessa/jarvis_ui/MainActivity.kt "$RUNNER_TEMP/jarvis-native/MainActivity.kt"
          cp android/app/src/main/kotlin/com/dancorsoodessa/jarvis_ui/JarvisTimerReceiver.kt "$RUNNER_TEMP/jarvis-native/JarvisTimerReceiver.kt"
      - name: Generate Android project
        working-directory: ui
        run: |
          set -e
          flutter create --platforms=android --org=com.dancorsoodessa --project-name=jarvis_ui .
          rm -f test/widget_test.dart
      - name: Restore native Android tools and channels
        working-directory: ui
        shell: bash
        run: |
          set -euo pipefail
          KOTLIN=android/app/src/main/kotlin/com/dancorsoodessa/jarvis_ui
          mkdir -p "$KOTLIN"
          cp "$RUNNER_TEMP/jarvis-native/MainActivity.kt" "$KOTLIN/MainActivity.kt"
          cp "$RUNNER_TEMP/jarvis-native/JarvisTimerReceiver.kt" "$KOTLIN/JarvisTimerReceiver.kt"
          cp android_tool_router.kt "$KOTLIN/AndroidToolRouter.kt"
          cp android_tools/TradingTools.kt "$KOTLIN/TradingTools.kt"
          cp android_tools/StockAnalysisTools.kt "$KOTLIN/StockAnalysisTools.kt"
          for dir in database files internet other selfimprovement; do
            find "android_tools/$dir" -type f -name '*.kt' -exec cp {} "$KOTLIN/" \;
          done
      - name: Configure Android permissions
        working-directory: ui
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/src/main/AndroidManifest.xml")
          text = p.read_text(encoding="utf-8")
          permissions = [
              '    <uses-permission android:name="android.permission.INTERNET" />',
              '    <uses-permission android:name="android.permission.RECORD_AUDIO" />',
              '    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />',
          ]
          for permission in permissions:
              if permission not in text:
                  text = text.replace("<application", permission + "\n    <application", 1)
          if "android.speech.RecognitionService" not in text:
              text = text.replace("<application", '    <queries>\n        <intent>\n            <action android:name="android.speech.RecognitionService" />\n        </intent>\n    </queries>\n    <application', 1)
          receiver = '        <receiver android:name=".JarvisTimerReceiver" android:exported="false" />'
          if "JarvisTimerReceiver" not in text:
              text = text.replace("        <meta-data android:name=\"flutterEmbedding\"", receiver + "\n        <meta-data android:name=\"flutterEmbedding\"", 1)
          p.write_text(text, encoding="utf-8")
          PY
      - name: Install JARVIS launcher logo
        working-directory: ui
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          res = Path("android/app/src/main/res")
          (res / "drawable").mkdir(parents=True, exist_ok=True)
          icon = """<vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp" android:height="108dp"
              android:viewportWidth="108" android:viewportHeight="108">
              <path android:fillColor="#05080F" android:pathData="M0,0h108v108h-108z"/>
              <path android:fillColor="#0D1622" android:pathData="M54,8A46,46 0,1 0,54 100A46,46 0,1 0,54 8"/>
              <path android:fillColor="#FF000000" android:fillAlpha="0" android:pathData="M0,0h108v108h-108z"/>
              <path android:strokeColor="#37D5EE" android:strokeWidth="2.4" android:fillColor="#00000000" android:pathData="M54,17A37,37 0,1 0,54 91A37,37 0,1 0,54 17"/>
              <path android:strokeColor="#37D5EE" android:strokeWidth="2.5" android:fillColor="#00000000" android:pathData="M54,28L72,39L72,62L54,73L36,62L36,39Z"/>
              <path android:strokeColor="#37D5EE" android:strokeWidth="2.5" android:fillColor="#00000000" android:pathData="M54,28L54,17M72,39L84,32M72,62L84,69M54,73L54,88M36,62L24,69M36,39L24,32"/>
              <path android:fillColor="#37D5EE" android:pathData="M49,43h10l-6,10h7l-12,14l3,-11h-7z"/>
              <path android:fillColor="#FFFFFF" android:pathData="M52,12A4,4 0,1 0,52 20A4,4 0,1 0,52 12M80,28A4,4 0,1 0,80 36A4,4 0,1 0,80 28M80,65A4,4 0,1 0,80 73A4,4 0,1 0,80 65M52,84A4,4 0,1 0,52 92A4,4 0,1 0,52 84M20,65A4,4 0,1 0,20 73A4,4 0,1 0,20 65M20,28A4,4 0,1 0,20 36A4,4 0,1 0,20 28"/>
          </vector>"""
          (res / "drawable" / "jarvis_launcher.xml").write_text(icon, encoding="utf-8")
          manifest = Path("android/app/src/main/AndroidManifest.xml")
          text = manifest.read_text(encoding="utf-8")
          text = re.sub(r'android:icon="[^"]+"', '', text)
          text = re.sub(r'android:roundIcon="[^"]+"', '', text)
          text = re.sub(r'(<application\\b[^>]*?)>', r'\\1 android:icon="@drawable/jarvis_launcher" android:roundIcon="@drawable/jarvis_launcher">', text, count=1)
          manifest.write_text(text, encoding="utf-8")
          # Fail the build if the icon or manifest reference is missing.
          assert (res / "drawable" / "jarvis_launcher.xml").stat().st_size > 500
          assert 'android:icon="@drawable/jarvis_launcher"' in text
          print("JARVIS launcher logo configured")
          PY
      - name: Get dependencies
        working-directory: ui
        run: flutter pub get
      - name: Build release APK
        working-directory: ui
        run: flutter build apk --release
      - name: Verify APK
        working-directory: ui
        run: |
          set -e
          APK=build/app/outputs/flutter-apk/app-release.apk
          test -s "$APK"
          file "$APK"
          sha256sum "$APK"
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-android-apk
          path: ui/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
