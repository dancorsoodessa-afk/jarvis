name: Build JARVIS Android APK

on:
  push:
    branches: [android-final]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project
        working-directory: ui
        run: flutter create --platforms=android --org=com.dancorsoodessa --project-name=jarvis_ui .

      - name: Configure required Android permissions
        working-directory: ui
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          text = manifest.read_text(encoding="utf-8")
          permissions = [
              '    <uses-permission android:name="android.permission.INTERNET" />',
              '    <uses-permission android:name="android.permission.RECORD_AUDIO" />',
              '    <queries>',
              '        <intent>',
              '            <action android:name="android.speech.RecognitionService" />',
              '        </intent>',
              '    </queries>',
          ]
          missing = []
          if "android.permission.INTERNET" not in text:
              missing.append(permissions[0])
          if "android.permission.RECORD_AUDIO" not in text:
              missing.append(permissions[1])
          if "android.speech.RecognitionService" not in text:
              missing.extend(permissions[2:])
          if missing:
              lines = text.splitlines()
              for index, line in enumerate(lines):
                  if line.lstrip().startswith("<manifest "):
                      lines[index + 1:index + 1] = missing
                      break
              else:
                  raise SystemExit("AndroidManifest.xml has no <manifest> root element")
              manifest.write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY

      - name: Get dependencies
        working-directory: ui
        run: flutter pub get

      - name: Analyze Dart
        working-directory: ui
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build release APK
        working-directory: ui
        run: flutter build apk --release

      - name: Verify APK integrity, alignment, signature and permissions
        shell: bash
        run: |
          set -euo pipefail
          APK="ui/build/app/outputs/flutter-apk/app-release.apk"
          test -s "$APK"
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n1)"
          test -x "$BUILD_TOOLS/zipalign"
          test -x "$BUILD_TOOLS/apksigner"
          test -x "$BUILD_TOOLS/aapt"
          "$BUILD_TOOLS/zipalign" -c -v 4 "$APK"
          "$BUILD_TOOLS/apksigner" verify --verbose "$APK"
          "$BUILD_TOOLS/aapt" dump permissions "$APK" | tee /tmp/jarvis-permissions.txt
          grep -q 'android.permission.INTERNET' /tmp/jarvis-permissions.txt
          grep -q 'android.permission.RECORD_AUDIO' /tmp/jarvis-permissions.txt
          sha256sum "$APK" | tee ui/build/app/outputs/flutter-apk/SHA256SUMS.txt

      - name: Upload verified APK
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-android-apk
          path: |
            ui/build/app/outputs/flutter-apk/app-release.apk
            ui/build/app/outputs/flutter-apk/SHA256SUMS.txt
          if-no-files-found: error
