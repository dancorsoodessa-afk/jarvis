name: Android APK

on:
  push:
    branches:
      - fix/android-mic-compact-chat-20261028
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android platform files if missing
        working-directory: ui
        run: |
          if [ ! -f android/app/src/main/AndroidManifest.xml ]; then
            flutter create --platforms=android --project-name jarvis_ui .
          fi

      - name: Resolve dependencies
        working-directory: ui
        run: flutter pub get

      - name: Static analysis
        working-directory: ui
        run: flutter analyze --no-pub

      - name: Unit tests
        working-directory: ui
        run: flutter test --no-pub

      - name: Build release APK
        working-directory: ui
        run: flutter build apk --release

      - name: Verify APK exists and calculate SHA-256
        run: |
          test -s ui/build/app/outputs/flutter-apk/app-release.apk
          sha256sum ui/build/app/outputs/flutter-apk/app-release.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-android-release
          path: ui/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
