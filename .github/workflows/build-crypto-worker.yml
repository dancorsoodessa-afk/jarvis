name: Build Crypto Worker Container

on:
  pull_request:
    branches: [foundation]
    paths:
      - 'agent/**'
      - 'crypto_analyst/**'
      - 'strategic/**'
      - 'storage/**'
      - 'Dockerfile.crypto'
      - 'docker-compose.crypto.yml'
      - 'pyproject.toml'
      - '.github/workflows/build-crypto-worker.yml'
  push:
    branches: [foundation]
    paths:
      - 'agent/**'
      - 'crypto_analyst/**'
      - 'strategic/**'
      - 'storage/**'
      - 'Dockerfile.crypto'
      - 'docker-compose.crypto.yml'
      - 'pyproject.toml'
      - '.github/workflows/build-crypto-worker.yml'

permissions:
  contents: read

jobs:
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate Compose configuration
        env:
          POSTGRES_PASSWORD: ci-test-password-not-for-production
        run: docker compose --env-file .env.crypto.example -f docker-compose.crypto.yml config --quiet
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build worker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.crypto
          push: false
          tags: jarvis-crypto-worker:ci
