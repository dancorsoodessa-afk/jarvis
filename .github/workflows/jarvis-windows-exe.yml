name: JARVIS Windows EXE

on:
  workflow_dispatch:
  push:
    branches:
      - foundation
      - feature/gemini-cloud-provider
    paths:
      - "agent/**"
      - "tests/**"
      - "scripts/build_exe.ps1"
      - "jarvis_desktop.py"
      - "jarvis_desktop.spec"
      - "pyproject.toml"
      - ".github/workflows/jarvis-windows-exe.yml"

permissions:
  contents: read

concurrency:
  group: jarvis-windows-exe-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-windows:
    name: Build and test Windows x64
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Build JARVIS and run tests
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts\build_exe.ps1
          if ($LASTEXITCODE -ne 0) {
            throw "JARVIS build script failed with exit code $LASTEXITCODE"
          }
          if (-not (Test-Path "release\JARVIS.exe")) {
            throw "Build completed without release\JARVIS.exe"
          }
          if ((Get-Item "release\JARVIS.exe").Length -lt 1MB) {
            throw "JARVIS.exe is unexpectedly small; refusing to publish."
          }

      - name: Upload executable artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-Windows-x64
          path: |
            release/JARVIS.exe
            release/README.txt
          if-no-files-found: error
          retention-days: 14

      - name: Upload diagnostic logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-Windows-build-diagnostics
          path: |
            *.log
            build/
            dist/
            release/
          if-no-files-found: ignore
          retention-days: 7
