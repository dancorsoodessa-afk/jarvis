name: Build JARVIS Android APK

on:
  push:
    branches: [foundation, standalone-pc-android, architecture-unification]
  pull_request:
    branches: [foundation, standalone-pc-android]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android platform
        working-directory: ui
        run: |
          flutter create --platforms=android --org=com.dancorsoodessa --project-name=jarvis_ui .
          rm -rf test
          python3 - <<'PY'
          from pathlib import Path
          p = Path('pubspec.yaml')
          text = p.read_text(encoding='utf-8')
          if 'flutter_lints:' not in text:
              text = text.replace('dev_dependencies:\n', 'dev_dependencies:\n  flutter_lints: ^6.0.0\n')
              p.write_text(text, encoding='utf-8')
          PY
          test ! -e test/widget_test.dart

      - name: Install JARVIS Android host layer
        working-directory: ui
        run: |
          test -f android_native/MainActivity.java
          mkdir -p android/app/src/main/java/com/dancorsoodessa/jarvis_ui
          cp android_native/MainActivity.java android/app/src/main/java/com/dancorsoodessa/jarvis_ui/MainActivity.java
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/src/main/AndroidManifest.xml')
          text = p.read_text(encoding='utf-8')
          text = text.replace('android:name=".MainActivity"', 'android:name=".MainActivity"')
          p.write_text(text, encoding='utf-8')
          PY

      - name: Configure Android permissions for AI and voice
        working-directory: ui
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/src/main/AndroidManifest.xml')
          text = p.read_text(encoding='utf-8')
          permissions = [
              '    <uses-permission android:name="android.permission.INTERNET" />',
              '    <uses-permission android:name="android.permission.RECORD_AUDIO" />',
              '    <uses-permission android:name="android.permission.BLUETOOTH" />',
              '    <uses-permission android:name="android.permission.BLUETOOTH_ADMIN" />',
              '    <uses-permission android:name="android.permission.BLUETOOTH_CONNECT" />',
          ]
          pos = text.find('>') + 1
          for permission in permissions:
              if permission not in text:
                  text = text[:pos] + '\n' + permission + text[pos:]
                  pos += len(permission) + 1
          if 'android.speech.RecognitionService' not in text:
              query = '''\n    <queries>\n      <intent>\n        <action android:name="android.speech.RecognitionService" />\n      </intent>\n      <intent>\n        <action android:name="android.intent.action.TTS_SERVICE" />\n      </intent>\n    </queries>\n'''
              text = text.replace('<application', query + '\n    <application', 1)
          p.write_text(text, encoding='utf-8')
          PY

      - name: Get dependencies
        working-directory: ui
        run: flutter pub get

      - name: Verify Android architecture boundaries
        working-directory: ui
        run: |
          test -f android/app/src/main/java/com/dancorsoodessa/jarvis_ui/MainActivity.java
          ! grep -R "speech_to_text" -n lib pubspec.yaml
          ! grep -R "Process.start" -n lib/main.dart lib/jarvis_client.dart || true

      - name: Analyze Dart code
        working-directory: ui
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Flutter smoke tests
        working-directory: ui
        run: flutter test

      - name: Build release APK
        working-directory: ui
        run: flutter build apk --release

      - name: Upload JARVIS APK
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-android-apk
          path: ui/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Publish APK to GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/architecture-unification'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="android-build-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" ui/build/app/outputs/flutter-apk/app-release.apk \
            --target "$GITHUB_SHA" \
            --title "JARVIS Android Build ${GITHUB_RUN_NUMBER}" \
            --notes "Android APK built from ${GITHUB_SHA}." \
            --prerelease
