name: Build JARVIS Windows

on:
  push:
    branches: [foundation]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build JARVIS
        shell: pwsh
        run: |
          powershell -ExecutionPolicy Bypass -File scripts\build_exe.ps1

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-Windows-x64
          path: JARVIS-Windows-x64.zip
          if-no-files-found: error
