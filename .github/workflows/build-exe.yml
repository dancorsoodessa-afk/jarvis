name: Build JARVIS для Windows

on:
  push:
    branches: [foundation, standalone-pc-android]
  pull_request:
    branches: [foundation]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Установить зависимости
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[all]"
          python -m pip install --upgrade pyinstaller pytest

      - name: Проверить тесты
        run: pytest tests/ -q

      - name: Собрать JARVIS.exe
        run: pyinstaller jarvis.spec --clean --noconfirm

      - name: Собрать JARVIS Desktop.exe
        run: pyinstaller jarvis_desktop.spec --clean --noconfirm

      - name: Подготовить пакет для ПК
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Copy-Item dist\jarvis.exe release\JARVIS.exe
          Copy-Item dist\jarvis_desktop.exe release\JARVIS-Desktop.exe
          Compress-Archive -Path release\JARVIS.exe,release\JARVIS-Desktop.exe -DestinationPath JARVIS-Windows-x64.zip -Force

      - name: Загрузить сборку
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-Windows-x64
          path: JARVIS-Windows-x64.zip
