name: Build JARVIS Android APK

on:
  push:
    branches: [foundation, standalone-pc-android, android-final]
  pull_request:
    branches: [foundation, standalone-pc-android, android-final]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android platform
        working-directory: ui
        run: |
          flutter create --platforms=android --org=com.dancorsoodessa --project-name=jarvis_ui .
          rm -rf test
          python3 - <<'PY'
          from pathlib import Path
          p = Path('pubspec.yaml')
          text = p.read_text(encoding='utf-8')
          if 'flutter_lints:' not in text:
              text = text.replace('dev_dependencies:\n', 'dev_dependencies:\n  flutter_lints: ^6.0.0\n')
              p.write_text(text, encoding='utf-8')
          PY
          test ! -e test/widget_test.dart

      - name: Allow internet, microphone and TTS access
        working-directory: ui
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/src/main/AndroidManifest.xml')
          text = p.read_text(encoding='utf-8')
          pos = text.find('>') + 1
          permissions = [
              '    <uses-permission android:name="android.permission.INTERNET" />',
              '    <uses-permission android:name="android.permission.RECORD_AUDIO" />',
          ]
          insert = '\n' + '\n'.join(x for x in permissions if x not in text) + '\n'
          if insert.strip():
              text = text[:pos] + insert + text[pos:]
          if 'android.intent.action.TTS_SERVICE' not in text:
              marker = '</manifest>'
              queries = '''\n    <queries>\n        <intent>\n            <action android:name="android.intent.action.TTS_SERVICE" />\n        </intent>\n    </queries>\n'''
              text = text.replace(marker, queries + marker)
          p.write_text(text, encoding='utf-8')
          PY

      - name: Add native Android timer and notification service
        working-directory: ui
        run: |
          python3 - <<'PY'
          from pathlib import Path
          manifest = Path('android/app/src/main/AndroidManifest.xml')
          text = manifest.read_text(encoding='utf-8')
          perms = [
              '    <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" />',
              '    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />',
          ]
          pos = text.find('>') + 1
          missing = [p for p in perms if p not in text]
          if missing:
              text = text[:pos] + '\\n' + '\\n'.join(missing) + '\\n' + text[pos:]
          receiver = '''        <receiver
            android:name=".JarvisAlarmReceiver"
            android:exported="false" />'''
          text = text.replace('</application>', receiver + '\\n    </application>')
          manifest.write_text(text, encoding='utf-8')
          main = Path('android/app/src/main/kotlin/com/dancorsoodessa/jarvis_ui/MainActivity.kt')
          main.parent.mkdir(parents=True, exist_ok=True)
          main.write_text(r'''package com.dancorsoodessa.jarvis_ui

import android.Manifest
import android.app.AlarmManager
import android.app.PendingIntent
import android.content.Context
import android.content.Intent
import android.os.Build
import io.flutter.embedding.android.FlutterActivity
import io.flutter.embedding.engine.FlutterEngine
import io.flutter.plugin.common.MethodChannel

class MainActivity : FlutterActivity() {
    private val channel = "com.dancorsoodessa.jarvis/timer"

    override fun configureFlutterEngine(flutterEngine: FlutterEngine) {
        super.configureFlutterEngine(flutterEngine)
        if (Build.VERSION.SDK_INT >= 33) {
            requestPermissions(arrayOf(Manifest.permission.POST_NOTIFICATIONS), 1001)
        }
        MethodChannel(flutterEngine.dartExecutor.binaryMessenger, channel).setMethodCallHandler { call, result ->
            when (call.method) {
                "scheduleTimer" -> {
                    val delayMs = call.argument<Long>("delayMs") ?: 0L
                    val label = call.argument<String>("label") ?: "Таймер"
                    if (delayMs <= 0L) {
                        result.error("BAD_DELAY", "Неверная длительность", null)
                        return@setMethodCallHandler
                    }
                    scheduleTimer(delayMs, label)
                    result.success(true)
                }
                else -> result.notImplemented()
            }
        }
    }

    private fun scheduleTimer(delayMs: Long, label: String) {
        val alarmManager = getSystemService(Context.ALARM_SERVICE) as AlarmManager
        val intent = Intent(this, JarvisAlarmReceiver::class.java).apply {
            putExtra("label", label)
        }
        val pending = PendingIntent.getBroadcast(
            this, (System.currentTimeMillis() and 0x7fffffff).toInt(), intent,
            PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE
        )
        val at = System.currentTimeMillis() + delayMs
        if (Build.VERSION.SDK_INT >= 23) {
            try {
                alarmManager.setExactAndAllowWhileIdle(AlarmManager.RTC_WAKEUP, at, pending)
            } catch (_: SecurityException) {
                alarmManager.setAndAllowWhileIdle(AlarmManager.RTC_WAKEUP, at, pending)
            }
        } else {
            alarmManager.setExact(AlarmManager.RTC_WAKEUP, at, pending)
        }
    }
}
''', encoding='utf-8')
          receiver = Path('android/app/src/main/kotlin/com/dancorsoodessa/jarvis_ui/JarvisAlarmReceiver.kt')
          receiver.write_text(r'''package com.dancorsoodessa.jarvis_ui

import android.app.NotificationChannel
import android.app.NotificationManager
import android.app.PendingIntent
import android.content.BroadcastReceiver
import android.content.Context
import android.content.Intent
import android.os.Build
import androidx.core.app.NotificationCompat

class JarvisAlarmReceiver : BroadcastReceiver() {
    override fun onReceive(context: Context, intent: Intent) {
        val label = intent.getStringExtra("label") ?: "Таймер"
        val manager = context.getSystemService(Context.NOTIFICATION_SERVICE) as NotificationManager
        val channelId = "jarvis_timers"
        if (Build.VERSION.SDK_INT >= 26) {
            manager.createNotificationChannel(
                NotificationChannel(channelId, "JARVIS таймеры", NotificationManager.IMPORTANCE_HIGH)
            )
        }
        val launch = PendingIntent.getActivity(
            context, 0,
            Intent(context, MainActivity::class.java),
            PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE
        )
        val notification = NotificationCompat.Builder(context, channelId)
            .setSmallIcon(android.R.drawable.ic_lock_idle_alarm)
            .setContentTitle("JARVIS")
            .setContentText("Таймер завершён: " + label)
            .setPriority(NotificationCompat.PRIORITY_HIGH)
            .setAutoCancel(true)
            .setContentIntent(launch)
            .build()
        manager.notify((System.currentTimeMillis() and 0x7fffffff).toInt(), notification)
    }
}
''', encoding='utf-8')
          PY

      - name: Get dependencies
        working-directory: ui
        run: flutter pub get

      - name: Compatibility fix for speech_to_text
        working-directory: ui
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('lib/main.dart')
          text = p.read_text(encoding='utf-8')
          if "package:speech_to_text/speech_recognition_result.dart" not in text:
              text = text.replace("import 'package:speech_to_text/speech_to_text.dart' as stt;", "import 'package:speech_to_text/speech_recognition_result.dart' as speech_result;\nimport 'package:speech_to_text/speech_to_text.dart' as stt;")
          text = text.replace("void _onSpeechResult(stt.SpeechRecognitionResult result)", "void _onSpeechResult(dynamic result)")
          p.write_text(text, encoding='utf-8')
          PY

      - name: Analyze Dart code
        working-directory: ui
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build release APK
        working-directory: ui
        run: flutter build apk --release

      - name: Upload JARVIS APK
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-android-apk
          path: ui/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
