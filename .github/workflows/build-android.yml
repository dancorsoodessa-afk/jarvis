name: Build JARVIS Android APK

on:
  push:
    branches: ["**"]
    paths:
      - "ui/**"
      - ".github/workflows/build-android.yml"
  pull_request:
    branches: [foundation, standalone-pc-android, android-complete-20261005]
    paths:
      - "ui/**"
      - ".github/workflows/build-android.yml"
  workflow_dispatch:

concurrency:
  group: jarvis-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android project
        working-directory: ui
        run: |
          set -e
          flutter create --platforms=android --org=com.dancorsoodessa --project-name=jarvis_ui .
          rm -rf test
      - name: Configure Android permissions
        working-directory: ui
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/src/main/AndroidManifest.xml")
          text = p.read_text(encoding="utf-8")
          permissions = [
              '    <uses-permission android:name="android.permission.INTERNET" />',
              '    <uses-permission android:name="android.permission.RECORD_AUDIO" />',
          ]
          for permission in permissions:
              if permission not in text:
                  text = text.replace("<application", permission + "\n    <application", 1)
          if "android.speech.RecognitionService" not in text:
              text = text.replace("<application", '    <queries>\n        <intent>\n            <action android:name="android.speech.RecognitionService" />\n        </intent>\n    </queries>\n    <application', 1)
          p.write_text(text, encoding="utf-8")
          PY
      - name: Get dependencies
        working-directory: ui
        run: flutter pub get
      - name: Analyze Dart
        working-directory: ui
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Build release APK
        working-directory: ui
        run: flutter build apk --release
      - name: Verify APK
        working-directory: ui
        run: |
          set -e
          APK=build/app/outputs/flutter-apk/app-release.apk
          test -s "$APK"
          file "$APK"
          sha256sum "$APK"
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-android-apk
          path: ui/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
