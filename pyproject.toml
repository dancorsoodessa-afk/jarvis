[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis-agent"
version = "0.1.0"
description = "Personal AI agent / desktop assistant for Windows x64 (cloud-first, local llama.cpp + Vulkan opt-in)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
# Screenshot support on all platforms
screenshot = ["Pillow>=10.0"]
# Volume control on Windows (COM Audio API)
windows-audio = ["pycaw>=20240210 ; sys_platform == 'win32'"]
all = ["Pillow>=10.0", "pycaw>=20240210 ; sys_platform == 'win32'"]

[project.scripts]
jarvis = "agent.__main__:main"

[tool.setuptools.packages.find]
include = ["agent*"]
