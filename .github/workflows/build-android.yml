name: Build JARVIS Android APK

on:
  push:
    branches: [android-final]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android project
        working-directory: ui
        run: flutter create --platforms=android --org=com.dancorsoodessa --project-name=jarvis_ui .
      - name: Remove generated stale test
        working-directory: ui
        run: rm -rf test
      - name: Get dependencies
        working-directory: ui
        run: flutter pub get
      - name: Analyze
        working-directory: ui
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Build APK
        working-directory: ui
        run: flutter build apk --release
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-android-apk
          path: ui/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
