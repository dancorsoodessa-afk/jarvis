<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JARVIS</title>
<style>
:root{--bg:#05070c;--panel:#0b1019;--line:#1b2b3c;--cyan:#38d9ff;--cyan2:#7cf0ff;--text:#e8f6ff;--muted:#71879a;--green:#55e39b;--red:#ff647c}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% 35%,#102538 0,#07101a 35%,#03050a 75%);color:var(--text);font:14px Segoe UI,Arial,sans-serif;height:100vh;overflow:hidden}.app{height:100%;display:grid;grid-template-columns:250px 1fr 280px}.side,.right{background:rgba(5,9,15,.82);border-color:var(--line);border-style:solid}.side{border-width:0 1px 0 0;padding:24px}.right{border-width:0 0 0 1px;padding:24px}.brand{font-size:25px;letter-spacing:6px;color:var(--cyan);font-weight:700;text-shadow:0 0 18px #38d9ff66}.sub{color:var(--muted);font-size:11px;letter-spacing:2px;margin-top:5px}.nav{margin-top:40px;display:grid;gap:8px}.nav button,.action{background:#0b131e;border:1px solid var(--line);color:#cfe5f2;padding:12px;border-radius:8px;text-align:left;cursor:pointer}.nav button:hover,.action:hover{border-color:var(--cyan);color:white;box-shadow:0 0 16px #38d9ff18}.main{position:relative;display:flex;flex-direction:column}.top{height:70px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 28px;background:#05091088}.status{display:flex;gap:10px;align-items:center;color:var(--green)}.dot{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 14px var(--green)}.core{flex:1;display:flex;align-items:center;justify-content:center;position:relative}.orb{width:290px;height:290px;border-radius:50%;border:1px solid #38d9ff88;box-shadow:0 0 35px #38d9ff33, inset 0 0 55px #38d9ff1a;display:flex;align-items:center;justify-content:center;position:relative;animation:pulse 3s ease-in-out infinite}.orb:before,.orb:after{content:"";position:absolute;border-radius:50%;border:1px solid #38d9ff55}.orb:before{inset:25px;animation:spin 10s linear infinite}.orb:after{inset:55px;border-color:#7cf0ff66;animation:spin 7s linear infinite reverse}.eye{font-size:46px;letter-spacing:8px;color:var(--cyan2);text-shadow:0 0 30px #38d9ff;z-index:2}.wave{position:absolute;bottom:18%;width:55%;height:55px;display:flex;align-items:center;justify-content:center;gap:4px}.bar{width:3px;background:var(--cyan);border-radius:4px;animation:wave .8s ease-in-out infinite alternate}.bar:nth-child(2n){animation-delay:.15s}.bar:nth-child(3n){animation-delay:.3s}.prompt{position:absolute;bottom:7%;color:var(--muted);letter-spacing:2px}.chat{position:absolute;left:28px;top:25px;color:#b8cad6}.msg{background:#0a121cbb;border:1px solid var(--line);padding:12px 15px;border-radius:10px;max-width:430px}.right h3{font-size:11px;letter-spacing:2px;color:var(--muted);font-weight:500}.metric{border-bottom:1px solid var(--line);padding:13px 0;display:flex;justify-content:space-between}.value{color:var(--cyan)}.controls{position:absolute;bottom:28px;left:28px;right:28px;display:flex;gap:10px}.input{flex:1;background:#080e16;border:1px solid var(--line);color:white;border-radius:9px;padding:13px 15px;outline:none}.input:focus{border-color:var(--cyan)}.send{background:#0d2532;border:1px solid var(--cyan);color:var(--cyan2);border-radius:9px;padding:0 20px;cursor:pointer}@keyframes pulse{50%{transform:scale(1.04);box-shadow:0 0 55px #38d9ff55,inset 0 0 65px #38d9ff25}}@keyframes spin{to{transform:rotate(360deg)}}@keyframes wave{to{height:42px}}@media(max-width:900px){.app{grid-template-columns:190px 1fr}.right{display:none}} 
</style></head>
<body><div class="app"><aside class="side"><div class="brand">JARVIS</div><div class="sub">PERSONAL AI SYSTEM</div><div class="nav"><button onclick="say('Система')">◈ Система</button><button onclick="say('Память')">◉ Память</button><button onclick="say('Инструменты')">⌁ Инструменты</button><button onclick="say('Настройки')">⚙ Настройки</button></div></aside><main class="main"><div class="top"><b>COMMAND CENTER</b><div class="status"><span class="dot"></span> ONLINE · CLOUD</div></div><section class="core"><div class="chat"><div class="msg" id="msg">Система готова. Чем могу помочь?</div></div><div class="orb"><div class="eye">J·A·R</div></div><div class="wave" id="wave"></div><div class="prompt">LISTENING FOR COMMAND</div><div class="controls"><input id="input" class="input" placeholder="Напишите команду JARVIS..." onkeydown="if(event.key==='Enter')send()"><button class="send" onclick="send()">SEND</button></div></section></main><aside class="right"><h3>SYSTEM STATUS</h3><div class="metric"><span>Core</span><span class="value">ONLINE</span></div><div class="metric"><span>AI Provider</span><span class="value">CLOUD</span></div><div class="metric"><span>Voice</span><span class="value">READY</span></div><div class="metric"><span>Memory</span><span class="value">ACTIVE</span></div><h3 style="margin-top:35px">QUICK ACTIONS</h3><button class="action" style="width:100%;margin-bottom:8px" onclick="sendText('Покажи статус системы')">System status</button><button class="action" style="width:100%;margin-bottom:8px" onclick="sendText('Который сейчас час?')">Time</button><button class="action" style="width:100%" onclick="sendText('Что ты умеешь?')">Capabilities</button></aside></div><script>const w=document.getElementById('wave');for(let i=0;i<45;i++){let b=document.createElement('i');b.className='bar';b.style.height=(4+Math.random()*24)+'px';b.style.animationDuration=(.45+Math.random()*.7)+'s';w.appendChild(b)}function send(){let x=document.getElementById('input');if(x.value.trim())sendText(x.value);x.value=''}function sendText(t){document.getElementById('msg').textContent='Вы: '+t;setTimeout(()=>document.getElementById('msg').textContent='JARVIS: Команда принята. Я готов выполнить её.',500)}</script></body></html>
