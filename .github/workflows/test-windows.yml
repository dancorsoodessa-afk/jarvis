name: JARVIS Windows tests

on:
  push:
    branches: [foundation, feature/live-system-command-center, fix/full-audit-voice-security-tests]
    paths:
      - "agent/**"
      - "ui/**"
      - "scripts/prepare_3d_assets.ps1"
      - "tests/**"
      - "jarvis_desktop.py"
      - "pyproject.toml"
      - "poetry.lock"
      - ".github/workflows/test-windows.yml"
  pull_request:
    branches: [foundation]
    paths:
      - "agent/**"
      - "ui/**"
      - "scripts/prepare_3d_assets.ps1"
      - "tests/**"
      - "jarvis_desktop.py"
      - "pyproject.toml"
      - "poetry.lock"
      - ".github/workflows/test-windows.yml"

concurrency:
  group: jarvis-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install -e ".[all]"
          python -m pip install "pytest>=9,<10"
      - name: Prepare pinned local Three.js assets
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts\prepare_3d_assets.ps1
      - name: Run tests
        shell: pwsh
        run: pytest tests/ -q
      - name: Desktop import
        shell: pwsh
        run: python -c "import jarvis_desktop; print('JARVIS desktop import OK')"
