name: Build Windows JARVIS EXE

on:
  push:
    branches: [foundation]
    paths:
      - 'jarvis_desktop.py'
      - 'jarvis_desktop.spec'
      - 'agent/**'
      - 'docs/**'
      - '.github/workflows/build-windows-exe.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install build and runtime dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller requests pillow sounddevice numpy pycaw comtypes pypdf python-docx openpyxl opencv-python-headless
      - name: Compile Python modules
        shell: pwsh
        run: |
          python -m compileall -q agent jarvis_desktop.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Smoke-test imports and advertised tools
        shell: pwsh
        run: |
          python -c "import cv2; from agent.runtime import build_agent; from agent.tools_catalog import TOOLS; a=build_agent(); missing=sorted({x[0] for x in TOOLS}-set(a.tools.names())); assert not missing, f'Missing advertised tools: {missing}'; assert not cv2.CascadeClassifier(cv2.data.haarcascades + 'haarcascade_frontalface_default.xml').empty(); print(f'OK: {len(a.tools.names())} tools registered; OpenCV cascade loaded')"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build desktop executable
        run: pyinstaller --clean --noconfirm jarvis_desktop.spec
      - name: Prepare release asset
        shell: pwsh
        run: |
          if (!(Test-Path 'dist/jarvis_desktop.exe')) { throw 'PyInstaller output dist/jarvis_desktop.exe was not found' }
          Copy-Item 'dist/jarvis_desktop.exe' 'dist/JARVIS.exe' -Force
      - name: Publish versioned release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: windows-${{ github.run_number }}
          name: JARVIS Windows Build ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          fail_on_unmatched_files: true
          files: dist/JARVIS.exe
