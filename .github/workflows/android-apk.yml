name: Android APK

on:
  push:
    branches:
      - fix/android-mic-compact-chat-20261028
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android platform files if missing
        working-directory: ui
        run: |
          if [ ! -f android/app/src/main/AndroidManifest.xml ]; then
            flutter create --platforms=android --project-name jarvis_ui .
          fi
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()
          permissions = [
              '    <uses-permission android:name="android.permission.INTERNET"/>',
              '    <uses-permission android:name="android.permission.RECORD_AUDIO"/>',
          ]
          missing = [line for line in permissions if line not in s]
          if missing:
              marker = '<manifest'
              i = s.find('>', s.find(marker))
              if i < 0:
                  raise SystemExit("Malformed AndroidManifest.xml")
              s = s[:i+1] + chr(10) + chr(10).join(missing) + s[i+1:]
              p.write_text(s)
          PY

      - name: Set Android compile SDK for current plugins
        working-directory: ui
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          candidates = [Path("android/app/build.gradle.kts"), Path("android/app/build.gradle")]
          changed = False
          for path in candidates:
              if not path.exists():
                  continue
              source = path.read_text(encoding="utf-8")
              updated = source.replace("compileSdk = flutter.compileSdkVersion", "compileSdk = 36")
              updated = updated.replace("compileSdkVersion flutter.compileSdkVersion", "compileSdkVersion 36")
              updated = updated.replace("compileSdk flutter.compileSdkVersion", "compileSdk 36")
              if updated != source:
                  path.write_text(updated, encoding="utf-8")
                  changed = True
          if not changed:
              raise SystemExit("Could not set Android compileSdk to 36 in generated Gradle file")
          PY

      - name: Remove generated sample test
        working-directory: ui
        run: rm -f test/widget_test.dart

      - name: Resolve dependencies
        working-directory: ui
        run: flutter pub get

      - name: Static analysis
        id: analyze
        continue-on-error: true
        working-directory: ui
        run: flutter analyze --no-pub

      - name: Unit tests
        id: tests
        continue-on-error: true
        working-directory: ui
        run: flutter test --no-pub

      - name: Build release APK
        working-directory: ui
        run: flutter build apk --release

      - name: Verify APK exists and calculate SHA-256
        run: |
          test -s ui/build/app/outputs/flutter-apk/app-release.apk
          sha256sum ui/build/app/outputs/flutter-apk/app-release.apk

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-android-release
          path: ui/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: warn
          retention-days: 14

      - name: Enforce quality gate
        if: always()
        env:
          ANALYSIS_OUTCOME: ${{ steps.analyze.outcome }}
          TEST_OUTCOME: ${{ steps.tests.outcome }}
        run: |
          if [ "$ANALYSIS_OUTCOME" != "success" ] || [ "$TEST_OUTCOME" != "success" ]; then
            echo "Static analysis or unit tests failed; inspect the logs before treating this build as verified."
            exit 1
          fi
