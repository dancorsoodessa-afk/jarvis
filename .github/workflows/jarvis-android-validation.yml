name: JARVIS Android validation
on:
  push:
    branches:
      - fix/android-voice-folders-audit-20261027
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android project
        working-directory: ui
        run: flutter create --platforms=android --org=com.dancorsoodessa --project-name=jarvis_ui .

      - name: Set Android compile SDK for current plugins
        working-directory: ui
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          candidates = [
              Path("android/app/build.gradle.kts"),
              Path("android/app/build.gradle"),
          ]
          changed = False
          for path in candidates:
              if not path.exists():
                  continue
              source = path.read_text(encoding="utf-8")
              updated = source
              updated = re.sub(r'compileSdk\s*=\s*flutter\.compileSdkVersion', 'compileSdk = 36', updated)
              updated = re.sub(r'compileSdkVersion\s+flutter\.compileSdkVersion', 'compileSdkVersion 36', updated)
              updated = re.sub(r'compileSdk\s+flutter\.compileSdkVersion', 'compileSdk 36', updated)
              if updated != source:
                  path.write_text(updated, encoding="utf-8")
                  changed = True
          if not changed:
              raise SystemExit("Could not set Android compileSdk to 36 in generated Gradle file")
          PY

      - name: Install dependencies
        working-directory: ui
        run: flutter pub get
      - name: Analyze Dart code
        working-directory: ui
        run: flutter analyze
      - name: Run Flutter tests
        working-directory: ui
        run: flutter test
      - name: Build Android debug APK
        working-directory: ui
        run: flutter build apk --debug
      - name: Upload verified build artifact
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-android-debug
          path: ui/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7
