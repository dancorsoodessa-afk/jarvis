[tool.poetry]
name = "jarvis-agent"
version = "0.1.0"
description = "Personal AI agent / desktop assistant for Windows x64"
authors = ["Jarvis Developer"]
license = "MIT"
readme = "README.md"
packages = [{ include = "agent" }]

[tool.poetry.dependencies]
python = ">=3.10,<3.15"
Pillow = { version = ">=10.0", optional = true }
pycaw = { version = ">=20240210", optional = true, markers = "sys_platform == 'win32'" }
sounddevice = ">=0.5.0"
numpy = ">=1.24"
vosk = ">=0.3.45"
pypdf = { version = ">=5.0.0", optional = true }
python-docx = { version = ">=1.1.0", optional = true }
openpyxl = { version = ">=3.1.0", optional = true }

[tool.poetry.extras]
screenshot = ["Pillow"]
windows-audio = ["pycaw"]
voice = ["sounddevice", "numpy", "vosk"]
documents = ["pypdf", "python-docx", "openpyxl"]
all = ["Pillow", "pycaw", "sounddevice", "numpy", "vosk", "pypdf", "python-docx", "openpyxl"]

[tool.poetry.scripts]
jarvis = "agent.__main__:main"

[tool.poetry.group.dev.dependencies]
pytest = ">=8.0"

[build-system]
requires = ["poetry-core>=1.9"]
build-backend = "poetry.core.masonry.api"
